[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waybar-pomodoro"
version = "1.1.0"
description = "A lightweight, customizable Pomodoro timer module for Waybar"
readme = "README.md"
authors = [{ name = "qwerpik", email = "qwerpik@users.noreply.github.com" }]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
keywords = ["waybar", "pomodoro", "timer", "productivity", "linux", "wayland", "status-bar"]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
lint = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
build = [
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
waybar-pomodoro = "waybar_pomodoro.cli:main"

[project.urls]
Homepage = "https://github.com/qwerpik/waybar-pomodoro"
Repository = "https://github.com/qwerpik/waybar-pomodoro.git"
Issues = "https://github.com/qwerpik/waybar-pomodoro/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
